<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>pid 分组 自测</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 20px; }
  iframe { width: 1100px; height: 900px; border: 1px solid #ccc; }
  .pass { color: #0a7d32; font-weight: 600; }
  .fail { color: #c22; font-weight: 600; }
  pre { background: #f6f6f6; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>pid 分组 自测（纯名字 + pid · 编号降序）</h2>
<div id="status">等待 iframe 就绪…</div>
<pre id="out"></pre>
<iframe id="app" src="/index.html"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
function done(ok) {
  const el = document.getElementById('status');
  el.innerHTML = ok ? '<span class="pass">全部通过</span>' : '<span class="fail">存在失败项</span>';
  document.title = ok ? 'TEST-PASS' : 'TEST-FAIL';
}

function makeFile(name, color) {
  const s = 200, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, s, s);
  x.fillStyle = '#8a6a4f';
  x.beginPath(); x.arc(s / 2, s * 0.56, s * 0.3, 0, 7); x.fill();
  const bin = atob(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
  const u8 = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
  return new File([u8], name, { type: 'image/jpeg' });
}

function setVal(input, v) {
  input.value = v;
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

function runChecks(win, doc) {
  let ok = true;
  const chk = (cond, label, extra) => {
    log((cond ? 'PASS ' : 'FAIL ') + label + (cond ? '' : ' → ' + (extra ?? '')));
    if (!cond) ok = false;
  };
  const q = (sel, root) => (root || doc).querySelector(sel);
  const qa = (sel, root) => [...(root || doc).querySelectorAll(sel)];

  // 文件名解析：非数字开头不自动填
  chk(win.parseFileName('小白-英短-花园.jpg') === null, '中文开头的文件名不自动填');
  const parsed = win.parseFileName('90-咪咪-A楼302.jpg');
  chk(!!parsed && parsed.name === '咪咪' && parsed.pid === '90' && parsed.place === 'A楼302',
      '数字开头解析为 纯名+pid+地址', JSON.stringify(parsed));
  chk(win.parseFileName('90-all.jpg').name === '合照', 'all → 合照（纯名）');

  // 旧数据迁移：名字括号里的编号拆进 pid（「奶牛(大)」这种非编号括号不动）
  const mig1 = { name: '咪咪(1)', pid: '' };
  win.stripNameSuffix(mig1);
  chk(mig1.name === '咪咪' && mig1.pid === '1', '迁移：咪咪(1) → 纯名+pid', JSON.stringify(mig1));
  const mig2 = { name: '合照(2)', pid: '' };
  win.stripNameSuffix(mig2);
  chk(mig2.name === '合照' && mig2.pid === '2', '迁移：合照(2) → 合照+pid', JSON.stringify(mig2));
  const mig3 = { name: '奶牛(大)', pid: '' };
  win.stripNameSuffix(mig3);
  chk(mig3.name === '奶牛(大)' && !mig3.pid, '迁移：非编号括号原样保留', JSON.stringify(mig3));

  const groups = qa('.group-card');
  chk(groups.length === 3, '5 张照片分成 3 组', groups.length);

  // 无编号照片排最前，编号组从大到小：未命名 → 91 → 90
  const gAnon = groups[0], g91 = groups[1], g90 = groups[2];
  chk(q('.f-pid', gAnon).value === '', '无编号照片排最前、单独一组', qa('.f-pid').map(i => i.value).join(','));
  chk(q('.f-pid', g91).value === '91' && q('.f-pid', g90).value === '90',
      '编号组从大到小 91 → 90', qa('.f-pid').map(i => i.value).join(','));

  const names90 = qa('.card .f-name', g90).map(i => i.value);
  chk(names90.length === 3 &&
      names90[0] === '奶牛' && names90[1] === '咪咪' && names90[2] === '合照',
      '名字存纯名（不带括号）、合照排最后、新照片在前', names90.join(' / '));

  chk(q('[data-gk="place"]', g90).value === 'A楼302', '组头地址取自文件名', q('[data-gk="place"]', g90).value);
  chk(/^\d{4}-\d{2}-\d{2}$/.test(q('[data-gk="date"]', g90).value), '组头日期默认今天');

  chk(qa('.card .f-name', g91).length === 1 && q('.card .f-name', g91).value === '波波', '订单 91 一张（纯名）');

  // 统计：4 猫咪（奶牛/咪咪/合照不算/波波）+ 3 客户（90/91/无编号算1）
  chk(q('#statCats').textContent === '4', '统计：4 只猫咪', q('#statCats').textContent);
  chk(q('#statClients').textContent === '3', '统计：3 位客户', q('#statClients').textContent);

  // 组头改地址 → 整组生效
  setVal(q('[data-gk="place"]', g90), 'C栋501');
  chk(q('[data-gk="place"]', g90).value === 'C栋501', '组头改地址整组生效');

  // 组头改 pid → 重新归组；名字保持纯名不受影响。编号 8 < 91，降序时排在 91 之后（无编号组仍最前）
  setVal(q('.f-pid', g90), '8');
  let gs = qa('.group-card');
  chk(gs.length === 3 && q('.f-pid', gs[2]).value === '8', '改 pid 后重新归组，序为 无编号→91→8', qa('.f-pid').map(i => i.value).join(','));
  const names8 = qa('.card .f-name', gs[2]).map(i => i.value);
  chk(names8.join('/') === '奶牛/咪咪/合照', '改 pid 后名字保持纯名不变', names8.join('/'));
  chk(q('[data-gk="place"]', gs[2]).value === 'C栋501', '归组后地址保留');

  // 编号框输入混入非数字 → 只留数字（每次重渲染后都要重新查询节点）
  const pidBox = qa('.f-pid')[1];
  setVal(pidBox, '9a1b');
  chk(qa('.f-pid')[1].value === '91', '编号框剔除非数字字符', qa('.f-pid')[1].value);

  // 给无编号照片补编号 8 → 并入 8 组（编号已存在会弹确认，这里放行）
  const origConfirm = win.confirm;
  win.confirm = () => true;
  setVal(qa('.f-pid')[0], '8');
  gs = qa('.group-card');
  chk(gs.length === 2 && q('.f-pid', gs[0]).value === '91' && q('.f-pid', gs[1]).value === '8' && qa('.card', gs[1]).length === 4,
      '无编号照片补编号 8 后并入该组', gs.length + ' 组 / pids ' + qa('.f-pid').map(i => i.value).join(',') + ' / 8组 ' + qa('.card', gs[1]).length + ' 张');

  // 改组内名字 → 不再影响 pid
  const nameInput = qa('.card .f-name', gs[1])[0];
  nameInput.value = '奶牛(大)';
  nameInput.dispatchEvent(new Event('input', { bubbles: true }));
  nameInput.dispatchEvent(new Event('change', { bubbles: true }));
  chk(qa('.card .f-name', gs[1])[0].value === '奶牛(大)' && q('.f-pid', gs[1]).value === '8',
      '名字带括号不再联动编号', qa('.card .f-name', gs[1]).map((i) => i.value).join('/'));

  // 排序切换：降序 ↔ 升序（无编号组不存在了，8 组应从后变前）
  const sortBtn = doc.getElementById('sortBtn');
  chk(!!sortBtn && sortBtn.textContent.includes('↓'), '排序按钮显示降序', sortBtn && sortBtn.textContent);
  sortBtn.click();
  chk(sortBtn.textContent.includes('↑'), '切换到升序', sortBtn.textContent);
  chk(qa('.f-pid').map((i) => i.value).join(',') === '8,91', '升序：8 → 91', qa('.f-pid').map((i) => i.value).join(','));
  sortBtn.click();
  chk(sortBtn.textContent.includes('↓') && qa('.f-pid').map((i) => i.value).join(',') === '91,8',
      '切回降序：91 → 8', qa('.f-pid').map((i) => i.value).join(','));

  // 改编号到已存在的编号 → 弹确认；取消则原编号不变
  win.confirm = () => false;
  setVal(qa('.f-pid')[0], '8');
  chk(qa('.f-pid').map((i) => i.value).join(',') === '91,8', '目标编号已存在 + 取消确认 → 编号不变', qa('.f-pid').map((i) => i.value).join(','));
  win.confirm = () => true;
  setVal(qa('.f-pid')[0], '8');
  win.confirm = origConfirm;
  chk(qa('.group-card').length === 1 && qa('.card', qa('.group-card')[0]).length === 5,
      '确认后 91 组并入 8 组', qa('.group-card').length + ' 组');

  // 收尾：关掉上传后自动弹出的裁剪队列，方便截图看列表
  const keepBtn = [...doc.querySelectorAll('button')].find((b) => b.textContent.includes('全部保持原样'));
  if (keepBtn) keepBtn.click();

  done(ok);
}

const iframe = document.getElementById('app');
let started = false;
const t0 = Date.now();
const timer = setInterval(() => {
  const win = iframe.contentWindow, doc = iframe.contentDocument;
  if (!win || !doc || !doc.getElementById('mosaicTag')) return;
  if (!started && typeof win.addFiles === 'function') {
    started = true;
    win.addFiles([
      makeFile('90-咪咪-A楼302.jpg', '#FFD9A8'),
      makeFile('90-奶牛.jpg', '#D6EFFF'),
      makeFile('90-all.jpg', '#E4F6D8'),
      makeFile('91-波波-B花园.jpg', '#FFE3EC'),
      makeFile('未命名猫.jpg', '#EADCFF')
    ]);
  }
  if (!started) return;
  const tag = doc.getElementById('mosaicTag').textContent;
  if (!tag.includes('5 张照片')) {
    if (Date.now() - t0 > 20000) { clearInterval(timer); log('FAIL: 5 张未加载完成, tag=' + tag); done(false); }
    return;
  }
  clearInterval(timer);
  try { runChecks(win, doc); } catch (e) { log('FAIL: 异常 ' + e.message); done(false); }
}, 100);
</script>
</body>
</html>
