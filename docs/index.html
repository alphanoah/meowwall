<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>喵星人头像墙</title>
<meta name="description" content="每一位上门喂过的喵星人，都在这张大猫头里。">
<meta property="og:title" content="喵星人头像墙">
<meta property="og:description" content="每一位上门喂过的喵星人，都在这张大猫头里。">
<meta property="og:type" content="website">
<meta property="og:image" content="meowtonians/拼贴-大猫头.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 900'><path fill='%23E8894A' d='M500 872 C356 872 176 748 172 572 C169 498 190 418 208 352 L148 92 C143 74 158 58 176 66 L372 158 C414 140 456 131 500 131 C544 131 586 140 628 158 L824 66 C842 58 857 74 852 92 L792 352 C810 418 831 498 828 572 C824 748 644 872 500 872 Z'/></svg>">
<link rel="stylesheet" href="share.css">
</head>
<body>

<div class="overview" id="overview"></div>
<div class="goalbar" id="goalBar" hidden>
  <span class="gb-txt" id="goalTxt"></span>
  <span class="gb-track"><span class="gb-fill" id="goalFill"></span></span>
</div>

<button class="info-btn" id="infoBtn" type="button" aria-pressed="true" title="只显示拼贴">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7.6" r="1.15" fill="currentColor"/><path d="M12 10.6v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
</button>

<main class="stage">
  <canvas id="mosaic" width="1400" height="1260" aria-label="由喵星人照片拼成的大猫头"></canvas>

  <div class="loading" id="loading">
    <svg class="load-cat" viewBox="0 0 1000 900" aria-hidden="true">
      <path d="M500 872 C356 872 176 748 172 572 C169 498 190 418 208 352 L148 92 C143 74 158 58 176 66 L372 158 C414 140 456 131 500 131 C544 131 586 140 628 158 L824 66 C842 58 857 74 852 92 L792 352 C810 418 831 498 828 572 C824 748 644 872 500 872 Z"/>
    </svg>
    <p id="loadTxt">正在铺满猫头…</p>
    <div class="load-track"><div class="load-bar" id="loadBar"></div></div>
  </div>
</main>

<footer class="foot">
  <p class="layout-note" id="layoutNote"></p>
  <div class="bar">
    <div class="seg-btns" id="modeSeg">
      <button type="button" data-mode="grid" class="on">几 × 几 铺满</button>
      <button type="button" data-mode="auto">按照片均分</button>
    </div>
    <label class="ctl" id="densityCtl">
      <span>块数<em id="densityVal">13 × 12</em></span>
      <input type="range" id="density" min="5" max="22" value="13">
    </label>
    <label class="ctl">
      <span>间隙<em id="gapVal">3</em></span>
      <input type="range" id="gap" min="0" max="12" value="3">
    </label>
    <label class="ctl switch">
      <input type="checkbox" id="whiskers" checked>
      <span>轮廓 + 胡须</span>
    </label>
    <label class="ctl switch" title="页面上的脚印、溜达的小猫等氛围挂件">
      <input type="checkbox" id="widgetToggle" checked>
      <span>小挂件</span>
    </label>
    <label class="ctl switch" title="摸猫的时候会喵一声（点一下大猫头试试）">
      <input type="checkbox" id="meow" checked>
      <span>喵声</span>
    </label>
    <button class="btn-primary" id="shuffle" type="button">换一种排法</button>
    <button class="btn-soft" id="download" type="button" title="下载的整张图会带上 Theo 水印">下载这张</button>
  </div>
</footer>

<div id="petLayer" aria-hidden="true"></div>

<script src="share.js"></script>
<script src="widgets.js" defer></script>
</body>
</html>
